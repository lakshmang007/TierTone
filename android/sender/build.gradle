apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// Debug-only test tool: posts WhatsApp-shaped chat notifications so TierTone can be tested
// without WhatsApp. Uses Person/MessagingStyle(Person), hence API 28.
android {
    namespace = "app.tiertone.sender"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "app.tiertone.sender"
        minSdkVersion 28
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}
